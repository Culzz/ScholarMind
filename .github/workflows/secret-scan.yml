name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail when an environment file is committed
        run: |
          offenders="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '\.env\.example$' || true)"
          if [ -n "${offenders}" ]; then
            echo "environment files must not be committed:" >&2
            echo "${offenders}" >&2
            exit 1
          fi
          echo "no committed .env file"

      - name: Scan tracked files for secrets
        run: |
          python3 - <<'PY'
          import math
          import re
          import subprocess
          import sys
          from pathlib import Path

          # Known credential prefixes. Each pattern requires a plausible amount of
          # trailing material so that documentation and identifiers do not match.
          PREFIX_PATTERNS = [
              ("provider api key", re.compile(r"\bsk-[A-Za-z0-9]{20,}")),
              ("github token", re.compile(r"\bgh[pousr]_[A-Za-z0-9]{20,}")),
              ("aws access key id", re.compile(r"\bAKIA[0-9A-Z]{16}")),
              ("private key block", re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----")),
              ("json web token", re.compile(r"\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}")),
              ("slack token", re.compile(r"\bxox[baprs]-[A-Za-z0-9-]{10,}")),
          ]

          # Long random-looking runs. The underscore is excluded so that
          # environment-variable assignments (NAME=value) are not candidates.
          TOKEN_PATTERN = re.compile(r"[A-Za-z0-9+/=-]{32,}")
          ENTROPY_THRESHOLD = 4.5
          MIN_TOKEN_LENGTH = 32

          SKIP_NAMES = {
              "package-lock.json",
              "npm-shrinkwrap.json",
              "yarn.lock",
              "pnpm-lock.yaml",
              "poetry.lock",
              "Cargo.lock",
              "composer.lock",
          }
          SKIP_SUFFIXES = {
              ".lock",
              ".png",
              ".jpg",
              ".jpeg",
              ".gif",
              ".webp",
              ".ico",
              ".pdf",
              ".zip",
              ".gz",
              ".tar",
              ".woff",
              ".woff2",
              ".ttf",
              ".eot",
              ".parquet",
              ".pyc",
              ".so",
              ".dll",
              ".exe",
          }

          def shannon_entropy(text: str) -> float:
              counts: dict[str, int] = {}
              for char in text:
                  counts[char] = counts.get(char, 0) + 1
              length = len(text)
              return -sum(
                  (count / length) * math.log2(count / length) for count in counts.values()
              )

          def looks_like_secret(token: str) -> bool:
              if len(token) < MIN_TOKEN_LENGTH:
                  return False
              if shannon_entropy(token) < ENTROPY_THRESHOLD:
                  return False
              has_digit = any(char.isdigit() for char in token)
              has_upper = any(char.isupper() for char in token)
              has_lower = any(char.islower() for char in token)
              return has_digit and has_upper and has_lower

          def describe(token: str) -> str:
              return f"{len(token)} characters, entropy {shannon_entropy(token):.2f}"

          tracked = subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, text=True, check=True
          ).stdout.split("\0")

          findings: list[str] = []

          for name in sorted(path for path in tracked if path):
              path = Path(name)
              if path.name in SKIP_NAMES or path.suffix.lower() in SKIP_SUFFIXES:
                  continue
              if not path.is_file():
                  continue
              try:
                  raw = path.read_bytes()
              except OSError:
                  continue
              if b"\x00" in raw:
                  continue
              text = raw.decode("utf-8", errors="replace")

              for line_number, line in enumerate(text.splitlines(), start=1):
                  for label, pattern in PREFIX_PATTERNS:
                      if pattern.search(line):
                          findings.append(f"{name}:{line_number}: {label}")
                  for token in TOKEN_PATTERN.findall(line):
                      if looks_like_secret(token):
                          findings.append(
                              f"{name}:{line_number}: high-entropy string ({describe(token)})"
                          )

          if findings:
              print("possible secrets found in tracked files:", file=sys.stderr)
              for finding in findings:
                  print(f"  {finding}", file=sys.stderr)
              sys.exit(1)
          print("no secrets found in tracked files")
          PY
