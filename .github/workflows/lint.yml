name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.7.4

      - name: Lint
        run: ruff check .

  web:
    name: Web (eslint, tsc)
    # The frontend is optional. hashFiles() is evaluated on the runner, so it
    # cannot be used in a job-level `if` (GitHub rejects the whole workflow at
    # parse time); the frontend steps are guarded individually instead, after
    # the checkout has populated the workspace.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: hashFiles('apps/web/package.json') != ''
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            # No lockfile is committed yet; install without writing one.
            npm install --no-audit --no-fund --package-lock=false
          fi

      - name: Lint
        if: hashFiles('apps/web/package.json') != ''
        run: npm run lint

      - name: Typecheck
        if: hashFiles('apps/web/package.json') != ''
        run: npm run typecheck
