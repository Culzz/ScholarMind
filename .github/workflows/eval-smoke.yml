name: Evaluation smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: eval-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-smoke:
    name: eval smoke (dev split, 20 items)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the harness on the dev split
        env:
          PYTHONPATH: .
        run: |
          python -m research.evaluation.harness.runner \
            --experiment A \
            --split dev \
            --dataset research/bench/bench-v1/questions.jsonl \
            --limit 20 | tee eval-smoke-metrics.md

      - name: Upload the results
        uses: actions/upload-artifact@v4
        with:
          name: eval-smoke-metrics
          path: |
            eval-smoke-metrics.md
            research/experiments/**
          if-no-files-found: warn

      - name: Comment the metric table on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        permissions:
          contents: read
          pull-requests: write
        with:
          script: |
            const fs = require('fs');
            const table = fs.readFileSync('eval-smoke-metrics.md', 'utf8');
            const body = [
              '### Evaluation smoke test',
              '',
              'System: offline lexical stub over the dev split (20 items).',
              'These numbers exercise the harness plumbing; they are not a system quality claim.',
              '',
              table.trim(),
              '',
              'The committed regression gate is `research/evaluation/gate.py`, which compares',
              'the recorded metrics with `research/evaluation/thresholds.json`.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
