      Returns 403 to a plain fetch (bot protection). The URL is correct; capture
      needs the headless adapter or a manual capture with provenance.

  - url: https://www.setd.gov.ng/
    name: SETD Postgraduate Scholarship
    provider_type: government
    scope: [NGA]
    fetch_policy: manual
