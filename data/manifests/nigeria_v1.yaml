# ScholarMind source manifest — Nigeria-first corpus, 2027 intake.
#
# This file is the ingestion allowlist. A URL that is not listed here is never fetched.
#
# Fields
#   url            canonical official page (must be an official domain)
#   name           human label used in the admin UI
#   provider_type  government | university | foundation | ngo | corporate | multilateral
#   trust_tier     official_primary | official_secondary | partner | aggregator
#   cadence_hours  how often the source is re-checked (24 = daily, 168 = weekly)
#   scope          countries the opportunity targets ([] = any / stated on page)
#   level          intended study level
#   requires_render  true = the page renders its content in the browser, so a
#                            plain fetch captures navigation only and the content
#                            must be rendered (see scholarmind/ingestion/browser.py)
#   fetch_policy   direct  = fetched normally
#                  browser = the site blocks bots; needs the headless adapter or a
#                            manual capture (the URL itself is correct)
#                  manual  = not reachable from the fetcher (DNS, timeout or geo);
#                            the entry is entered by hand with provenance
#   notes          ingestion notes
#
# Every URL below was probed with the ScholarMind fetcher; the capture outcome is
# recorded in `notes` so the next operator knows what to expect. The aggregator
# tier is for discovery hints only: aggregator pages are never the source of a
# confirmed fact.

version: 2
corpus: nigeria_v1
target_intake_year: 2027

defaults:
  trust_tier: official_primary
  cadence_hours: 168
  level: masters
  fetch_policy: direct

sources:
  # --- Nigeria: government and national schemes ---------------------------
