# The web tier serves the static SPA and proxies API traffic to the uvicorn
# service so the refresh cookie stays first-party on one origin.
server {
    listen 80;
    server_name _;

    # The built SPA is content-addressed; root index must not be cached.
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
