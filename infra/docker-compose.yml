services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scholarmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scholarmind}
      POSTGRES_DB: ${POSTGRES_DB:-scholarmind}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scholarmind} -d ${POSTGRES_DB:-scholarmind}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scholarmind}:${POSTGRES_PASSWORD:-scholarmind}@db:5432/${POSTGRES_DB:-scholarmind}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scholarmind}:${POSTGRES_PASSWORD:-scholarmind}@db:5432/${POSTGRES_DB:-scholarmind}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  worker:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scholarmind}:${POSTGRES_PASSWORD:-scholarmind}@db:5432/${POSTGRES_DB:-scholarmind}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  seed:
    profiles: ["seed", "demo"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scholarmind}:${POSTGRES_PASSWORD:-scholarmind}@db:5432/${POSTGRES_DB:-scholarmind}
    command: ["python", "scripts/rebuild_corpus.py", "--yes", "--captures", "/app/data/raw/captures"]
    volumes:
      - ../data:/app/data:ro
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
